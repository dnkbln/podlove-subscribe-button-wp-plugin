--- # Podcast Client Configuration
- title: 'AntennaPod'
  platform: 'android'
  type: 'app'
  call_schema: '(feed) => `itpc://${removeProtocol(feed)}`'
  logo: 'antenna-pod/icon.svg'

- title: 'Apple Podcasts'
  platform: 'ios'
  type: 'app'
  call_schema: '(feed) => `podcast://${removeProtocol(feed)}`'
  logo: 'apple-podcasts/icon.svg'

- title: 'Apple Podcasts'
  platform: 'osx'
  type: 'app'
  call_schema: '(feed) => `podcast://${removeProtocol(feed)}`'
  logo: 'apple-podcasts/icon.svg'

- title: 'Apple Podcasts'
  platform: 'web'
  type: 'service'
  call_schema: "(id = '') => `https://podcasts.apple.com/podcast/${id.startsWith('id') ? id : 'id' + id}`"
  logo: 'apple-podcasts/icon.svg'

- title: 'gPodder'
  platform: 'unix'
  type: 'app'
  call_schema: '(feed) => `gpodder://${feed}`'
  logo: 'gpodder/icon.svg'

- title: 'gPodder'
  platform: 'windows'
  type: 'app'
  call_schema: '(feed) => `gpodder://${feed}`'
  logo: 'gpodder/icon.svg'

- title: 'gPodder'
  platform: 'web'
  type: 'service'
  call_schema: '(feed) => `http://gpodder.net/subscribe?url=${encodeURIComponent(removeHttps(feed))}`'
  logo: 'gpodder/icon.svg'
